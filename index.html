<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#14161e;color:#e6e9ef;
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif}
body.gating{display:flex;align-items:center;justify-content:center;
  min-height:100vh}
#gate{width:100%;max-width:360px;padding:32px 28px;text-align:center}
#gate img{width:72px;height:72px;border-radius:18px;margin-bottom:16px;transform:none;rotate:0deg;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
  filter:drop-shadow(0 0 13px var(--gc,#60b895));
  transition:filter .8s ease}
#gate h1{font-size:20px;margin-bottom:6px;letter-spacing:.5px}
#gate p{color:#9aa3b2;font-size:13px;margin-bottom:20px}
/* ★ 密码门上的实时倒数：访客还没输密码，就已经在用这个软件了 */
#gate #gateLive{color:#b9c1cf;font-size:12.5px;letter-spacing:.03em;
  min-height:18px;margin-bottom:14px}
#gate #gateLive b{color:var(--gc,#60b895);font-weight:600}
#gate #gateLive em{color:var(--gc,#60b895);font-style:normal}
#pw{width:100%;padding:12px 14px;font-size:15px;border-radius:10px;
  border:1px solid #2b3040;background:#1a1c24;color:#e6e9ef;outline:none}
#pw:focus{border-color:#60b895}
#go{width:100%;margin-top:12px;padding:12px;font-size:15px;font-weight:700;
  border:none;border-radius:10px;background:#60b895;color:#0f1a16;cursor:pointer}
#go:hover{background:#6fc9a2}
#go:disabled{opacity:.5;cursor:default}
#err{color:#ff8b8b;font-size:13px;margin-top:12px;min-height:18px}
#hint{color:#5a6273;font-size:11.5px;margin-top:18px;line-height:1.6}

</style>

<script>
(function () {
  // 禁止浏览器恢复上次的滚动位置（否则一打开就停在页面中间）
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  var ITER = 100000;
  var b64 = document.getElementById('payload').textContent.trim();

  /* ---- 时段色（明文层，无敏感内容）：跟解锁后的正文用同一套判定 ---- */
  var PHASE_COLOR = {work:'#6c8ebf', friday:'#d9b26f', off:'#60b895', monday:'#8a8f9c'};
  function phase(d) {
    var w = d.getDay(), h = d.getHours() + d.getMinutes()/60;
    if (w === 0 || w === 6) return 'off';
    if (w === 5 && h >= 12 && h < 18) return 'friday';
    if (w === 1 && h >= 6 && h < 12) return 'monday';
    if (h >= 9 && h < 18) return 'work';
    return 'off';
  }
  /* 门上的实时倒数：访客还没输密码，页面已经在替他倒数 */
  function gateLive() {
    var el = document.getElementById('gateLive');
    if (!el || el.closest('#gate').style.display === 'none') return;
    var d = new Date(), w = d.getDay(), h = d.getHours() + d.getMinutes()/60;
    var end = new Date(d); end.setHours(18, 0, 0, 0);
    var hh = function (ms) { return Math.floor(ms / 3600000); };
    var mm = function (ms) { return Math.floor(ms % 3600000 / 60000); };
    var txt;
    if (w === 0 || w === 6) txt = '今天是<em>不用上班</em>的日子';
    else if (h < 9) txt = '还没上班 · <b>09:00</b> 开工';
    else if (h < 18) {
      var left = end - d;
      txt = '距离下班还有 <b>' + hh(left) + ' 小时 ' + mm(left) + ' 分</b>';
      if (w === 5) txt += ' · 快到周末了';
    } else {
      var over = d - end;
      txt = over < 14 * 3600000
        ? '已经收工 <b>' + hh(over) + ' 小时 ' + mm(over) + ' 分</b>了'
        : '今天也下班了';
    }
    el.innerHTML = txt;
    document.documentElement.style.setProperty('--gc', PHASE_COLOR[phase(d)]);
  }
  gateLive();
  setInterval(gateLive, 1000);

  var ERRS = ['密码不对，再想想', '不是这个哦', '差一点点，但不是', '今天已经输错三次了吧'];

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(pw, salt) {
    var km = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
      km, 256);
    return crypto.subtle.importKey('raw', bits, { name: 'AES-GCM' }, false, ['decrypt']);
  }

  async function unlock(pw) {
    var d = b64ToBytes(b64);
    var salt  = d.slice(0, 16);
    var nonce = d.slice(16, 28);
    var tag   = d.slice(28, 44);
    var ct    = d.slice(44);
    var key = await deriveKey(pw, salt);
    var buf = new Uint8Array(ct.length + tag.length);
    buf.set(ct, 0); buf.set(tag, ct.length);
    var pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: nonce }, key, buf);
    return new TextDecoder().decode(pt);
  }

  function render(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    // script 不会因 innerHTML 自动执行，这里手动跑一遍
    var codes = [];
    tmp.querySelectorAll('script').forEach(function (s) {
      codes.push(s.textContent);
      s.parentNode.removeChild(s);
    });
    var app = document.getElementById('app');
    while (tmp.firstChild) app.appendChild(tmp.firstChild);
    codes.forEach(function (c) { new Function(c)(); });
  }

  function endGating() {
    try { document.body.classList.remove('gating'); } catch (e) {}
  }

  function toTop() {
    try {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    } catch (e) {}
  }

  function show(html) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').hidden = false;
    endGating();
    // 刷新页面时不必重新输密码（关掉标签页即失效）
    try { sessionStorage.setItem('html', html); } catch (e) {}
    toTop();
    // 部分浏览器渲染稍慢，兜底再滚一次
    setTimeout(toTop, 60);
    setTimeout(toTop, 300);
  }

  async function tryPw(pw) {
    var html;
    try { html = await unlock(pw); }
    catch (e) { return false; }
    render(html);
    show(html);
    return true;
  }

  // 刷新后直接复用，不用再输一次
  try {
    var cached = sessionStorage.getItem('html');
    if (cached) {
      render(cached);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').hidden = false;
      endGating();
      toTop();
      setTimeout(toTop, 60);
      setTimeout(toTop, 300);
    }
  } catch (e) {}

  document.getElementById('go').addEventListener('click', async function () {
    var pw = document.getElementById('pw').value;
    var btn = this, err = document.getElementById('err');
    if (!pw) { err.textContent = '请输入密码'; return; }
    btn.disabled = true; err.textContent = '验证中…';
    var ok = await tryPw(pw);
    btn.disabled = false;
    if (!ok) err.textContent = ERRS[Math.floor(Math.random() * ERRS.length)];
  });

  document.getElementById('pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('go').click();
  });
})();
</script>
</body>
</html>
