<script>
(function () {
  var ITER = 100000;
  var b64 = document.getElementById('payload').textContent.trim();

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(pw, salt) {
    var km = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
      km, 256);
    return crypto.subtle.importKey('raw', bits, { name: 'AES-GCM' }, false, ['decrypt']);
  }

  async function unlock(pw) {
    var d = b64ToBytes(b64);
    var salt  = d.slice(0, 16);
    var nonce = d.slice(16, 28);
    var tag   = d.slice(28, 44);
    var ct    = d.slice(44);
    var key = await deriveKey(pw, salt);
    var buf = new Uint8Array(ct.length + tag.length);
    buf.set(ct, 0); buf.set(tag, ct.length);
    var pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: nonce }, key, buf);
    return new TextDecoder().decode(pt);
  }

  function render(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    // script 不会因 innerHTML 自动执行，这里手动跑一遍
    var codes = [];
    tmp.querySelectorAll('script').forEach(function (s) {
      codes.push(s.textContent);
      s.parentNode.removeChild(s);
    });
    var app = document.getElementById('app');
    while (tmp.firstChild) app.appendChild(tmp.firstChild);
    codes.forEach(function (c) { new Function(c)(); });
  }

  function show(html) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').hidden = false;
    // 刷新页面时不必重新输密码（关掉标签页即失效）
    try { sessionStorage.setItem('html', html); } catch (e) {}
  }

  async function tryPw(pw) {
    var html;
    try { html = await unlock(pw); }
    catch (e) { return false; }
    render(html);
    show(html);
    return true;
  }

  // 刷新后直接复用，不用再输一次
  try {
    var cached = sessionStorage.getItem('html');
    if (cached) {
      render(cached);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').hidden = false;
    }
  } catch (e) {}

  document.getElementById('go').addEventListener('click', async function () {
    var pw = document.getElementById('pw').value;
    var btn = this, err = document.getElementById('err');
    if (!pw) { err.textContent = '请输入密码'; return; }
    btn.disabled = true; err.textContent = '验证中…';
    var ok = await tryPw(pw);
    btn.disabled = false;
    if (!ok) err.textContent = '密码不对';
  });

  document.getElementById('pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('go').click();
  });
})();
</script>
